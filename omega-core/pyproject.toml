[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-core"
version = "0.1.0"
description = "Open Formal Theorem Proving for Physics — proof engines (zero external Python deps)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shen Li"},
]

dependencies = []
# omega-core has ZERO external Python dependencies.
# It calls the system Lean 4 compiler via subprocess for T2 verification.
# LLM providers are injected via generate_fn / compile_fn callbacks.

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "pyright>=1.1",
    "sympy>=1.12",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/example/omega-core"

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["T20", "ARG001", "ARG002"]
"omega/verify/t2_mcp.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["omega", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
