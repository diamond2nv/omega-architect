[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-architect"
version = "0.2.2"
description = "Open Formal Theorem Proving for Physics, Optics, and Quantum Systems"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Core
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # LLM / MCP
    "openai>=1.0",
    "mcp>=1.0",
    # JSON repair (DeepSeek fallback parsing)
    "json_repair>=0.30",
]

[project.optional-dependencies]
# Development & testing
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.1",
    "pyright>=1.1",
    "sympy>=1.12",
    "matplotlib>=3.7",
]
# ML model routing (lightgbm model_router, lazy-imported)
ml = [
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]
# DSPy prompt optimisation (lazy-imported in prover/playbook)
dspy = [
    "dspy>=2.5",
]
# Analysis / Jupyter notebooks
analysis = [
    "sympy>=1.12",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
# All-in-one install
all = [
    "omega-architect[dev,ml,dspy,analysis]",
]

[project.urls]
Homepage = "https://github.com/diamond2nv/omega-architect"
Repository = "https://github.com/diamond2nv/omega-architect"
Issues = "https://github.com/diamond2nv/omega-architect/issues"
Changelog = "https://github.com/diamond2nv/omega-architect/releases"

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.setuptools.packages.find]
include = ["omega*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["T20"]
"scripts/*.py" = ["T20"]
"omega/verify/t2_mcp.py" = ["T201"]
"benchmarks/*.py" = ["T20", "E402", "C401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
# Skip tests requiring optional deps not installed
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "gate_b: Base functionality verification gates (B10-B11)",
    "gate_c: Topology/pipeline verification gates (C01-C02)",
    "gate_f: Magnitude/config verification gates (F01-F02)",
]

[tool.pyright]
include = ["omega", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[project.scripts]
omega = "omega.cli:main"
