project:
  type: book
  output-dir: _book

book:
  title: "Ω-Architect 用户指南"
  subtitle: "面向 AI4Math 的端到端形式化证明系统 — 安装、配置与接入"
  author: "Ω-Architect Team"
  date: today
  chapters:
    - index.qmd
    - ch01-overview.qmd
    - ch02-architecture.qmd
    - ch03-performance.qmd
    - ch04-quickstart.qmd
    - ch05-ecosystem.qmd
    - ch06-roadmap.qmd
  appendices:
    - appx-verification.qmd
    - appx-datasets.qmd
    - appx-tech-stack.qmd
    - METADATA.md
    - VERSION_TRACK.md

format:
  pdf:
    documentclass: ctexrep
    papersize: a4
    fontsize: 11pt
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    toc: true
    toc-depth: 3
    toc-title: "目录"
    number-sections: true
    colorlinks: true
    linkcolor: blue
    urlcolor: teal
    citecolor: blue!70!black
    mainfont: "Liberation Serif"
    sansfont: "Liberation Sans"
    monofont: "Liberation Mono"
    include-in-header:
      - text: |
          \usepackage{siunitx}
          \usepackage{booktabs}
          \usepackage{forest}
          \usepackage{longtable}
          \usepackage{xcolor}
          \usepackage{fancyhdr}
          \usepackage{titlesec}
          \usepackage{caption}
          \usepackage{subcaption}
          \usepackage{enumitem}
          \usepackage{graphicx}
          \usepackage{hyperref}
          \usepackage{listings}
          \usepackage{array}
          \usepackage{multirow}
          % ── Color palette ──
          \definecolor{accentblue}{HTML}{2D5F8A}
          \definecolor{softgray}{HTML}{666666}
          % ── Page style ──
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[C]{\small Ω-Architect 用户指南}
          \fancyhead[R]{\small\leftmark}
          \fancyfoot[C]{\thepage}
          \renewcommand{\headrulewidth}{0.4pt}
          \setlength{\headheight}{15pt}
          % ── Section formatting ──
          \titleformat{\chapter}{\Large\bfseries\color{accentblue}}{第\,\thechapter\,章}{1em}{}
          \titleformat{\section}{\large\bfseries}{\S\thesection}{1em}{}
          \titleformat{\subsection}{\normalsize\bfseries}{\S\thesubsection}{1em}{}
          % ── Table styling ──
          \captionsetup[table]{position=above,skip=3pt}
          \captionsetup[figure]{position=below,skip=3pt}
          \renewcommand{\arraystretch}{1.15}
          % ── Code listing ──
          \lstset{basicstyle=\small\ttfamily,breaklines=true,
            frame=single,numbers=left,numberstyle=\tiny\color{softgray}}
      - text: |
          % ── Version info (generated by metadata script) ──
          \IfFileExists{version-info.tex}{\input{version-info}}{}
    pdf-engine: xelatex
    keep-tex: true
