project:
  type: book
  output-dir: _book

book:
  title: "Ω-Architect 技术白皮书 v1.0"
  subtitle: "Loop Engineering for Lean4 Theorem Proving — 从 Prompt Engineering 到多路径证明引擎 + 策略学习的范式演进"
  author: "Ω-Architect Team"
  date: today
  chapters:
    - index.qmd
    - ch01-overview.qmd
    - ch02-architecture.qmd
    - ch03-proof-engine.qmd
    - ch04-policy-learning.qmd
    - ch05-engineering.qmd
    - ch06-experiments.qmd
    - ch07-ecosystem.qmd
  appendices:
    - appx-changelog.qmd
    - appx-roadmap.qmd
    - appx-old-architecture.qmd
    - METADATA.md
    - VERSION_TRACK.md

format:
  pdf:
    documentclass: ctexrep
    papersize: a4
    fontsize: 11pt
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    toc: true
    toc-depth: 3
    toc-title: "目录"
    number-sections: true
    colorlinks: true
    linkcolor: blue
    urlcolor: teal
    citecolor: blue!70!black
    mainfont: "Liberation Serif"
    sansfont: "Liberation Sans"
    monofont: "Liberation Mono"
    include-in-header:
      - text: |
          \usepackage{siunitx}
          \usepackage{booktabs}
          \usepackage{forest}
          \usepackage{longtable}
          \usepackage{xcolor}
          \usepackage{fancyhdr}
          \usepackage{titlesec}
          \usepackage{caption}
          \usepackage{subcaption}
          \usepackage{enumitem}
          \usepackage{graphicx}
          \usepackage{hyperref}
          \usepackage{listings}
          \usepackage{array}
          \usepackage{multirow}
          % ── Color palette ──
          \definecolor{accentblue}{HTML}{2D5F8A}
          \definecolor{softgray}{HTML}{666666}
          \definecolor{codegreen}{HTML}{228B22}
          \definecolor{codegray}{HTML}{555555}
          % ── Page style ──
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[C]{\small Ω-Architect 技术白皮书}
          \fancyhead[R]{\small\leftmark}
          \fancyfoot[C]{\thepage}
          \renewcommand{\headrulewidth}{0.4pt}
          \setlength{\headheight}{15pt}
          % ── Section formatting ──
          \titleformat{\chapter}{\Large\bfseries\color{accentblue}}{第\,\thechapter\,章}{1em}{}
          \titleformat{\section}{\large\bfseries}{\S\thesection}{1em}{}
          % ── Table styling ──
          \captionsetup[table]{position=above,skip=3pt}
          \captionsetup[figure]{position=below,skip=3pt}
          \renewcommand{\arraystretch}{1.15}
          % ── Code listing ──
          \lstset{basicstyle=\small\ttfamily,breaklines=true,
            frame=single,numbers=left,numberstyle=\tiny\color{softgray},
            keywordstyle=\color{accentblue},stringstyle=\color{codegreen}}
    pdf-engine: xelatex
    keep-tex: true
